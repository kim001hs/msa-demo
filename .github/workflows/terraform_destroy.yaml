name: "Terraform Destroy"

on:
  workflow_dispatch: # GitHub Actions 웹/모바일에서 수동 버튼 클릭으로 실행

# OIDC 토큰 발급을 위한 필수 권한
permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: "Terraform Destroy (Dev Env)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/envs/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. AWS 자격 증명 설정 (OIDC 기반 - 보안 키 없이 임시 자격 증명 발급)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::818719120165:role/msa-demo-github-actions-role' }}
          role-session-name: GitHubActions-TerraformDestroy
          aws-region: ap-northeast-2

      # 2. Terraform CLI 설치
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      # 3. 환경 변수 파일 준비 (gitignored 파일이므로 example 파일 복사)
      - name: Prepare terraform.tfvars
        run: |
          if [ ! -f terraform.tfvars ]; then
            cp terraform.tfvars.example terraform.tfvars
          fi

      # 4. S3 원격 백엔드 초기화
      - name: Terraform Init
        run: terraform init

      # 5. EKS 및 인프라 전체 자동 삭제 (과금 방어)
      - name: Terraform Destroy
        run: terraform destroy -auto-approve